<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body {
    background:#fbf7f0;
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    color:#1c1c1c;
    position:relative;
  }
  /* layered blush panel */
  .blush {
    position:absolute; inset:0;
    background:#f2dac4;
    clip-path: polygon(0 0, 100% 0, 100% 46%, 0 58%);
  }
  /* big soft sea circle */
  .circle {
    position:absolute;
    width:900px; height:900px;
    border-radius:50%;
    background:#61a596;
    opacity:0.26;
    top:-300px; right:-280px;
  }
  .circle2 {
    position:absolute;
    width:520px; height:520px;
    border-radius:50%;
    border:2px solid #c76a49;
    opacity:0.25;
    top:170px; right:-170px;
  }
  .frame {
    position:relative;
    height:100%;
    padding:264px 96px 308px;
    display:flex; flex-direction:column;
  }
  .marque { display:block; width:160px; height:auto; }
  .head { margin-top:60px; }
  .eyebrow {
    font-weight:700; text-transform:uppercase;
    letter-spacing:0.34em; font-size:26px; color:#c76a49;
  }
  .day {
    font-family:Georgia, 'Times New Roman', serif;
    font-style:italic; font-weight:400;
    font-size:236px; line-height:0.95;
    letter-spacing:-0.01em;
    color:#1c1c1c;
    margin-top:30px;
  }
  .date {
    font-family:Georgia, serif; font-style:italic;
    font-size:62px; color:#4a4238;
    margin-top:22px;
  }
  .rows { margin-top:auto; }
  .row {
    display:flex; align-items:baseline;
    padding:32px 0;
    border-top:1px solid rgba(199,106,73,0.45);
  }
  .row:last-child { border-bottom:1px solid rgba(199,106,73,0.45); }
  .time {
    font-family:Georgia, serif;
    font-size:58px; color:#1c1c1c;
    width:300px; flex:0 0 300px;
  }
  .time .ampm {
    font-style:italic; font-size:33px; color:#c76a49;
    margin-left:6px;
  }
  .what { flex:1; }
  .cls {
    font-weight:300; font-size:44px; letter-spacing:0.01em; color:#1c1c1c;
  }
  .teacher {
    font-family:Georgia, serif; font-style:italic;
    font-size:30px; color:#5f574b; margin-top:8px;
  }
  .footer {
    margin-top:48px;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .loc {
    font-weight:700; text-transform:uppercase;
    letter-spacing:0.24em; font-size:25px; color:#4a4238;
  }
  .cta {
    font-family:Georgia, serif; font-style:italic;
    font-size:36px; color:#1c1c1c;
    text-decoration:underline wavy #da8263;
    text-underline-offset:10px;
    text-decoration-thickness:2px;
  }
</style>
</head>
<body>
  <div class="blush"></div>
  <div class="circle"></div>
  <div class="circle2"></div>
  <div class="frame">
    <img class="marque" src="{{ASSETS}}/sealevel-logo-marque.png" alt="">
    <div class="head">
      <div class="eyebrow">Tomorrow on the mat</div>
      <div class="day">{{DAY_NAME}}</div>
      <div class="date">{{MONTH_DAY}}</div>
    </div>
    <div class="rows">
      <!--ROW-->
<div class="row">
        <div class="time">{{TIME}}<span class="ampm">{{AMPM}}</span></div>
        <div class="what">
          <div class="cls">{{CLASS_NAME}} &middot; {{DURATION}}</div>
          <div class="teacher">with {{TEACHER}}</div>
        </div>
      </div>
<!--/ROW-->
    </div>
    <div class="footer">
      <div class="loc">Fremont &middot; Seattle</div>
      <div class="cta">Reserve your spot</div>
    </div>
  </div>
</body>
</html>
