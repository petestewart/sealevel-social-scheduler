<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background:#fbf7f0;
    color:#1c1c1c;
    display:flex; flex-direction:column;
  }
  /* ---- top photo band (full-bleed into the top IG-UI zone; no content here) ---- */
  .band {
    height:560px;
    background:url('{{ASSETS}}/photos/yoga-mats.jpg') center 42% / cover no-repeat;
    position:relative;
    flex:0 0 auto;
  }
  .band::after{
    content:'';
    position:absolute; left:0; right:0; bottom:0; height:90px;
    background:linear-gradient(to bottom, rgba(251,247,240,0), rgba(251,247,240,0.0) 40%, rgba(251,247,240,0.15));
  }
  /* dot strip echoing mat colors */
  .dots{
    height:18px; flex:0 0 auto; display:flex;
  }
  .dots span{ flex:1; }
  .dots .c2{ flex:1.8; }
  .dots .c4{ flex:0.7; }
  .dots .c5{ flex:1.4; }
  .dots .c6{ flex:0.9; }
  .c1{ background:#61a596; }
  .c2{ background:#da8263; }
  .c3{ background:#7b9eaa; }
  .c4{ background:#e79c80; }
  .c5{ background:#4f9080; }
  .c6{ background:#f2dac4; }

  /* ---- body ---- */
  .content{
    flex:1;
    display:flex; flex-direction:column;
    padding:64px 96px 0;
  }
  .head{
    display:flex; align-items:flex-start; justify-content:space-between;
  }
  .head-left{ padding-top:8px; }
  .eyebrow{
    font-weight:700; text-transform:uppercase;
    letter-spacing:0.32em; font-size:24px; color:#c76a49;
    margin-bottom:20px;
  }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-style:italic; font-weight:400;
    font-size:92px; line-height:1.04;
    color:#4f9080;
  }
  h1 .day{ display:block; }
  .marque{
    width:180px; height:auto; margin-top:6px;
    flex:0 0 auto;
  }

  /* ---- class list ---- */
  .rows{
    margin-top:36px;
    flex:1;
    display:flex; flex-direction:column;
    justify-content:space-evenly;
    gap:0;
  }
  .row{
    display:flex; align-items:baseline;
    padding:30px 0;
    border-top:2px solid #ece3d5;
  }
  .row:first-child{ border-top:none; }
  .time{
    font-family:Georgia, serif;
    font-size:58px; color:#c76a49;
    width:295px; flex:0 0 auto;
    white-space:nowrap;
  }
  .time .ampm{ font-size:31px; font-style:italic; margin-left:6px; color:#da8263; }
  .what{ flex:1; }
  .cls{
    font-weight:300; font-size:44px; color:#1c1c1c;
    letter-spacing:0.01em;
  }
  .cls .dur{ color:#7b9eaa; }
  .teacher{
    margin-top:10px;
    font-family:Georgia, serif; font-style:italic;
    font-size:29px; color:#5f574b;
  }

  /* ---- footer (kept above IG's bottom ~300px UI zone) ---- */
  .footer{
    flex:0 0 auto;
    margin:0 96px 302px;
    border-top:2px solid #ece3d5;
    padding:38px 0 0;
    display:flex; align-items:center; justify-content:space-between;
  }
  .place{
    font-weight:700; text-transform:uppercase;
    letter-spacing:0.26em; font-size:23px; color:#5f574b;
  }
  .cta-wrap{ text-align:right; }
  .cta{
    font-family:Georgia, serif; font-style:italic;
    font-size:38px; color:#4f9080;
    
    
    
  }
  .url{
    margin-top:20px;
    font-weight:700; letter-spacing:0.14em;
    font-size:24px; color:#5f574b;
  }
</style>
</head>
<body>
  <div class="band"></div>
  <div class="dots">
    <span class="c1"></span><span class="c2"></span><span class="c3"></span>
    <span class="c4"></span><span class="c5"></span><span class="c6"></span>
  </div>

  <div class="content">
    <div class="head">
      <div class="head-left">
        <div class="eyebrow">Tomorrow on the mat</div>
        <h1><span class="day">{{DAY_NAME}},</span>{{MONTH_DAY}}</h1>
      </div>
      <img class="marque" src="{{ASSETS}}/sealevel-logo-marque.png" alt="Sealevel Hot Yoga">
    </div>

    <div class="rows">
      <!--ROW-->
<div class="row">
        <div class="time">{{TIME}}<span class="ampm">{{AMPM}}</span></div>
        <div class="what">
          <div class="cls">{{CLASS_NAME}} <span class="dur">· {{DURATION}}</span></div>
          <div class="teacher">with {{TEACHER}}</div>
        </div>
      </div>
<!--/ROW-->
    </div>
  </div>

  <div class="footer">
    <div class="place">Fremont · Seattle</div>
    <div class="cta-wrap">
      <div class="cta">Reserve your spot</div>
      <div class="url">sealevelhotyoga.com</div>
    </div>
  </div>
</body>
</html>
