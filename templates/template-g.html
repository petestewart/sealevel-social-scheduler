<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; }
  body {
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    background:#fbf7f0; color:#1c1c1c;
    display:flex;
  }
  /* ---------- left editorial column ---------- */
  .left {
    width:594px; height:1350px;
    padding:72px 64px 78px 72px;
    display:flex; flex-direction:column;
  }
  .marque { width:190px; display:block; }
  .eyebrow {
    margin-top:64px;
    font-weight:700; font-size:21px; letter-spacing:0.34em;
    text-transform:uppercase; color:#c76a49;
  }
  .day {
    margin-top:18px;
    font-family:Georgia, 'Times New Roman', serif; font-style:italic;
    font-weight:400; font-size:74px; line-height:1.05; color:#1c1c1c;
  }
  .rule {
    margin-top:40px; height:1px; background:#ded5c5; border:0; width:100%;
  }
  /* ---------- class list ---------- */
  .rows {
    flex:1; display:flex; flex-direction:column; justify-content:space-evenly;
    padding:8px 0;
  }
  .row {
    display:flex; align-items:baseline; gap:30px;
    padding:26px 0; border-bottom:1px solid #ece3d5;
  }
  .row:last-child { border-bottom:0; }
  .time {
    width:150px; flex:none;
    font-family:Georgia, serif; font-size:42px; color:#1c1c1c;
  }
  .time .ampm { font-size:23px; font-style:italic; color:#c76a49; margin-left:3px; }
  .what .class {
    font-weight:300; font-size:31px; letter-spacing:0.01em; color:#1c1c1c;
  }
  .what .teacher {
    margin-top:9px; font-family:Georgia, serif; font-style:italic;
    font-size:23px; color:#5f574b;
  }
  /* ---------- footer ---------- */
  .footer {
    padding-top:36px; border-top:1px solid #ded5c5;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .place {
    font-weight:700; font-size:18px; letter-spacing:0.22em;
    text-transform:uppercase; color:#5f574b;
  }
  .cta {
    font-family:Georgia, serif; font-style:italic; font-size:23px; color:#1c1c1c;
    text-decoration:underline wavy #da8263;
    text-underline-offset:7px; text-decoration-thickness:2px;
  }
  /* ---------- right photo strip ---------- */
  .right {
    width:486px; height:1350px; position:relative; overflow:hidden;
    background:#4a4238;
  }
  .right img {
    width:100%; height:100%; object-fit:cover; object-position:62% center;
    filter:saturate(0.55) contrast(0.98) brightness(1.02) sepia(0.28);
    display:block;
  }
  .tint {
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(218,130,99,0.32) 0%, rgba(199,106,73,0.30) 55%, rgba(74,66,56,0.42) 100%);
    mix-blend-mode:multiply;
  }
  .veil {
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(251,247,240,0.28) 0%, rgba(251,247,240,0) 22%);
  }
  .strip-label {
    position:absolute; left:0; right:0; bottom:44px; text-align:center;
    font-weight:700; font-size:17px; letter-spacing:0.32em; text-transform:uppercase;
    color:#fbf7f0; text-shadow:0 1px 14px rgba(28,28,28,0.45);
  }
</style>
</head>
<body>

<div class="left">
  <img class="marque" src="{{ASSETS}}/sealevel-logo-marque.png" alt="Sealevel Hot Yoga">
  <div class="eyebrow">Tomorrow on the mat</div>
  <div class="day">{{DAY_NAME}},<br>{{MONTH_DAY}}</div>
  <hr class="rule">
  <div class="rows">
    <!--ROW-->
<div class="row">
      <div class="time">{{TIME}}<span class="ampm">{{AMPM}}</span></div>
      <div class="what">
        <div class="class">{{CLASS_NAME}} &middot; {{DURATION}}</div>
        <div class="teacher">with {{TEACHER}}</div>
      </div>
    </div>
<!--/ROW-->
  </div>
  <div class="footer">
    <div class="place">Fremont &middot; Seattle</div>
    <div class="cta">Reserve your mat</div>
  </div>
</div>

<div class="right">
  <img src="{{ASSETS}}/photos/sustainable-yoga-sessions.png" alt="">
  <div class="tint"></div>
  <div class="veil"></div>
  <div class="strip-label">sealevelhotyoga.com</div>
</div>

</body>
</html>
