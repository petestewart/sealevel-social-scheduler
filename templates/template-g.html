<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body {
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    background:#fbf7f0; color:#1c1c1c;
    display:flex; flex-direction:column;
  }
  /* ---------- top editorial section (cream full-bleed; content inside story safe zone) ---------- */
  .left {
    width:1080px; height:1480px;
    padding:252px 84px 44px 84px;
    display:flex; flex-direction:column;
  }
  .masthead { display:flex; justify-content:space-between; align-items:flex-start; }
  .marque { width:170px; display:block; }
  .eyebrow {
    margin-top:32px;
    font-weight:700; font-size:34px; letter-spacing:0.26em;
    text-transform:uppercase; color:#c76a49;
  }
  .day {
    margin-top:12px;
    font-family:Georgia, 'Times New Roman', serif; font-style:italic;
    font-weight:400; font-size:84px; line-height:1.05; color:#1c1c1c;
  }
  .rule {
    margin-top:24px; height:1px; background:#ded5c5; border:0; width:100%;
  }
  /* ---------- class list ---------- */
  .rows {
    flex:1; display:flex; flex-direction:column; justify-content:space-evenly;
    padding:4px 0;
  }
  .row {
    display:flex; align-items:baseline; gap:30px;
    padding:14px 0; border-bottom:1px solid #ece3d5;
  }
  .row:last-child { border-bottom:0; }
  .time {
    width:240px; flex:none;
    font-family:Georgia, serif; font-size:64px; color:#1c1c1c;
  }
  .time .ampm { font-size:34px; font-style:italic; color:#c76a49; margin-left:3px; }
  .what .class {
    font-weight:300; font-size:52px; letter-spacing:0.01em; color:#1c1c1c;
  }
  .what .teacher {
    margin-top:8px; font-family:Georgia, serif; font-style:italic;
    font-size:38px; color:#4a4238;
  }
  /* ---------- footer ---------- */
  .footer {
    padding-top:24px; border-top:1px solid #ded5c5;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .place {
    font-weight:700; font-size:30px; letter-spacing:0.18em;
    text-transform:uppercase; color:#4a4238;
  }
  .cta {
    font-family:Georgia, serif; font-style:italic; font-size:34px; color:#1c1c1c;
    text-decoration:underline wavy #da8263;
    text-underline-offset:7px; text-decoration-thickness:2px;
  }
  /* ---------- bottom photo band (full-bleed to bottom edge) ---------- */
  .right {
    width:1080px; flex:1; position:relative; overflow:hidden;
    background:#4a4238;
  }
  .right img {
    width:100%; height:100%; object-fit:cover; object-position:center 30%;
    filter:saturate(0.55) contrast(0.98) brightness(1.02) sepia(0.28);
    display:block;
  }
  .tint {
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(218,130,99,0.32) 0%, rgba(199,106,73,0.30) 55%, rgba(74,66,56,0.42) 100%);
    mix-blend-mode:multiply;
  }
  .veil {
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(251,247,240,0.30) 0%, rgba(251,247,240,0) 20%);
  }
  /* domain sits inside the story safe zone (>=300px above the bottom edge) */
  .strip-label {
    position:absolute; left:0; right:0; bottom:330px; text-align:center;
    font-weight:700; font-size:36px; letter-spacing:0.26em; text-transform:uppercase;
    color:#fbf7f0; text-shadow:0 2px 10px rgba(28,28,28,0.85), 0 1px 24px rgba(28,28,28,0.65);
  }
</style>
</head>
<body>

<div class="left">
  <img class="marque" src="{{ASSETS}}/sealevel-logo-marque.png" alt="Sealevel Hot Yoga">
  <div class="eyebrow">Tomorrow on the mat</div>
  <div class="day">{{DAY_NAME}}, {{MONTH_DAY}}</div>
  <hr class="rule">
  <div class="rows">
    <!--ROW-->
<div class="row">
      <div class="time">{{TIME}}<span class="ampm">{{AMPM}}</span></div>
      <div class="what">
        <div class="class">{{CLASS_NAME}} &middot; {{DURATION}}</div>
        <div class="teacher">with {{TEACHER}}</div>
      </div>
    </div>
<!--/ROW-->
  </div>
  <div class="footer">
    <div class="place">Fremont &middot; Seattle</div>
    <div class="cta">Reserve your spot</div>
  </div>
</div>

<div class="right">
  <img src="{{ASSETS}}/photos/sustainable-yoga-sessions.png" alt="">
  <div class="tint"></div>
  <div class="veil"></div>
  <div class="strip-label">sealevelhotyoga.com</div>
</div>

</body>
</html>
