<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    position: relative;
    color: #fbf7f0;
  }
  .bg {
    position: absolute; inset: 0;
    background: url('{{ASSETS}}/photos/camel-pose.jpg') center 18% / cover no-repeat;
    filter: sepia(0.35) saturate(0.9) brightness(0.95);
  }
  .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(38,28,22,0.50) 0%,
      rgba(38,28,22,0.35) 26%,
      rgba(38,28,22,0.72) 55%,
      rgba(30,22,17,0.96) 100%);
  }
  .content {
    position: relative; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 92px 100px 84px;
  }
  .logo { width: 620px; }
  .eyebrow {
    margin-top: 46px;
    font-size: 25px; font-weight: 600; letter-spacing: 0.34em; text-transform: uppercase;
    color: #e79c80;
  }
  h1 {
    margin-top: 14px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 84px; font-weight: normal; font-style: italic;
    color: #fbf7f0;
  }
  .classes { margin-top: auto; width: 100%; display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: baseline; gap: 44px;
    padding: 36px 8px;
    border-top: 1px solid rgba(251,247,240,0.22);
  }
  .row:first-child { border-top: none; }
  .time {
    font-family: Georgia, serif; font-size: 56px; color: #e79c80;
    min-width: 265px;
  }
  .ampm { font-size: 30px; font-style: italic; }
  .cls { font-size: 40px; font-weight: 300; letter-spacing: 0.01em; }
  .teacher { font-size: 26px; color: rgba(251,247,240,0.72); margin-top: 10px; letter-spacing: 0.05em; }
  .footer {
    width: 100%; margin-top: 40px; padding-top: 34px;
    border-top: 1px solid rgba(231,156,128,0.45);
    display: flex; justify-content: space-between;
    font-size: 24px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(251,247,240,0.85);
  }
  .footer .sea { color: #61a596; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="content">
    <img class="logo" src="{{ASSETS}}/logo-v3.png">
    <div class="eyebrow">Tomorrow on the mat</div>
    <h1>{{DAY_NAME}}, {{MONTH_DAY}}</h1>
    <div class="classes">
      <!--ROW-->
      <div class="row">
        <div class="time">{{TIME}}<span class="ampm"> {{AMPM}}</span></div>
        <div><div class="cls">{{CLASS_NAME}} · {{DURATION}}</div><div class="teacher">with {{TEACHER}}</div></div>
      </div>
      <!--/ROW-->
    </div>
    <div class="footer">
      <div>Fremont · Seattle</div>
      <div class="sea">sealevelhotyoga.com</div>
    </div>
  </div>
</body>
</html>
