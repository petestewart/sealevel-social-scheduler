<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; }
  body {
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    background:linear-gradient(135deg, #c76a49 0%, #da8263 30%, #a9694f 62%, #4a4238 100%);
    color:#fbf7f0; position:relative;
  }
  /* soft heat glow */
  .glow {
    position:absolute; top:-220px; right:-180px; width:820px; height:820px;
    background:radial-gradient(circle, rgba(231,156,128,0.55) 0%, rgba(231,156,128,0) 65%);
    border-radius:50%;
  }
  /* floated figure, duotone-treated */
  .figure {
    position:absolute; right:-58px; bottom:118px;
    width:660px; opacity:0.40;
    filter:brightness(0) invert(97%) sepia(8%) saturate(300%) hue-rotate(330deg);
  }
  .frame {
    position:relative; height:1350px;
    padding:84px 84px 76px 84px;
    display:flex; flex-direction:column;
  }
  .logo { width:520px; display:block; }
  .eyebrow {
    margin-top:78px;
    font-weight:700; font-size:21px; letter-spacing:0.34em;
    text-transform:uppercase; color:#fbf7f0; opacity:0.92;
  }
  .day {
    margin-top:16px;
    font-family:Georgia, 'Times New Roman', serif; font-style:italic;
    font-weight:400; font-size:88px; line-height:1.04; color:#fbf7f0;
  }
  /* ---------- class list ---------- */
  .rows {
    flex:1; display:flex; flex-direction:column; justify-content:space-evenly;
    margin-top:34px; max-width:760px;
  }
  .row {
    display:flex; align-items:baseline; gap:36px;
    padding:26px 0; border-bottom:1px solid rgba(251,247,240,0.22);
  }
  .row:last-child { border-bottom:0; }
  .time {
    width:168px; flex:none;
    font-family:Georgia, serif; font-size:46px; color:#fbf7f0;
  }
  .time .ampm { font-size:24px; font-style:italic; color:#f2dac4; margin-left:4px; }
  .what .class {
    font-weight:300; font-size:33px; letter-spacing:0.01em; color:#fbf7f0;
  }
  .what .teacher {
    margin-top:9px; font-family:Georgia, serif; font-style:italic;
    font-size:24px; color:#f2dac4;
  }
  /* ---------- footer ---------- */
  .footer {
    padding-top:38px; border-top:1px solid rgba(251,247,240,0.28);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .place {
    font-weight:700; font-size:18px; letter-spacing:0.24em;
    text-transform:uppercase; color:#f2dac4;
  }
  .cta {
    font-family:Georgia, serif; font-style:italic; font-size:25px; color:#fbf7f0;
    text-decoration:underline wavy #f2dac4;
    text-underline-offset:7px; text-decoration-thickness:2px;
  }
</style>
</head>
<body>

<div class="glow"></div>
<img class="figure" src="{{ASSETS}}/photos/yogi2.png" alt="">

<div class="frame">
  <img class="logo" src="{{ASSETS}}/logo-v3.png" alt="Sealevel Hot Yoga">
  <div class="eyebrow">Tomorrow on the mat</div>
  <div class="day">{{DAY_NAME}}, {{MONTH_DAY}}</div>
  <div class="rows">
    <!--ROW-->
<div class="row">
      <div class="time">{{TIME}}<span class="ampm">{{AMPM}}</span></div>
      <div class="what">
        <div class="class">{{CLASS_NAME}} &middot; {{DURATION}}</div>
        <div class="teacher">with {{TEACHER}}</div>
      </div>
    </div>
<!--/ROW-->
  </div>
  <div class="footer">
    <div class="place">Fremont &middot; Seattle</div>
    <div class="cta">sealevelhotyoga.com</div>
  </div>
</div>

</body>
</html>
