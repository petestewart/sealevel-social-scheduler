<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body {
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    background:#3b342b;
    background:radial-gradient(120% 90% at 50% 0%, #4a4238 0%, #3b342b 62%, #332d25 100%);
    color:#fbf7f0;
    display:flex; flex-direction:column;
    align-items:center;
    /* Story-safe: IG UI covers top ~250px and bottom ~300px */
    padding:250px 110px 300px;
  }
  .logo{ width:600px; height:auto; flex:0 0 auto; }

  /* ---- arched inset photo ---- */
  .arch-wrap{
    margin-top:40px;
    flex:0 0 auto;
    position:relative;
  }
  .arch{
    width:300px; height:345px;
    object-fit:cover;
    border-radius:150px 150px 0 0;
    display:block;
    border:7px solid #f1ece2;
    box-shadow:0 24px 60px rgba(0,0,0,0.35);
    filter:sepia(0.12) brightness(1.02);
  }
  /* faint echo arch behind, offset */
  .arch-wrap::before{
    content:'';
    position:absolute; top:-16px; left:-20px;
    width:316px; height:361px;
    border:2px solid rgba(231,156,128,0.45);
    border-bottom:none;
    border-radius:158px 158px 0 0;
  }

  /* ---- heading ---- */
  .eyebrow{
    margin-top:36px;
    font-weight:700; text-transform:uppercase;
    letter-spacing:0.26em; font-size:34px; color:#e79c80;
  }
  h1{
    margin-top:12px;
    font-family:Georgia, 'Times New Roman', serif;
    font-style:italic; font-weight:400;
    font-size:74px; color:#fbf7f0;
    letter-spacing:0.01em;
  }

  /* ---- class list ---- */
  .rows{
    margin-top:16px;
    flex:1;
    width:100%;
    display:flex; flex-direction:column;
    justify-content:space-evenly;
  }
  .row{
    display:flex; align-items:baseline; justify-content:center;
    gap:32px;
    padding:14px 0;
    border-top:1px solid rgba(251,247,240,0.16);
  }
  .row:first-child{ border-top:none; }
  .time{
    font-family:Georgia, serif;
    font-size:64px; color:#e79c80;
    width:305px; flex:0 0 auto; text-align:right;
    white-space:nowrap;
  }
  .time .ampm{ font-size:34px; font-style:italic; margin-left:5px; opacity:0.9; }
  .what{ width:520px; flex:0 0 auto; text-align:left; }
  .cls{
    font-weight:400; font-size:52px; color:#fbf7f0;
  }
  .cls .dur{ color:rgba(251,247,240,0.8); }
  .teacher{
    margin-top:6px;
    font-family:Georgia, serif; font-style:italic;
    font-size:38px; color:rgba(251,247,240,0.92);
  }

  /* ---- footer (bottom of the safe zone, above IG's ~300px UI strip) ---- */
  .footer{
    flex:0 0 auto;
    width:100%;
    border-top:1px solid rgba(251,247,240,0.16);
    padding:26px 0 0;
    display:flex; align-items:center; justify-content:space-between;
  }
  .place{
    font-weight:700; text-transform:uppercase;
    letter-spacing:0.2em; font-size:30px; color:rgba(251,247,240,0.92);
  }
  .cta{
    font-family:Georgia, serif; font-style:italic;
    font-size:34px; color:#fbf7f0;
    
    
    
  }
</style>
</head>
<body>
  <img class="logo" src="{{ASSETS}}/logo-horizontal-cream.png" alt="Sealevel Hot Yoga">

  <div class="arch-wrap">
    <img class="arch" src="{{ASSETS}}/photos/SL-INST-7-of-16.jpg" alt="Seated meditation">
  </div>

  <div class="eyebrow">Tomorrow on the mat</div>
  <h1>{{DAY_NAME}}, {{MONTH_DAY}}</h1>

  <div class="rows">
    <!--ROW-->
<div class="row">
      <div class="time">{{TIME}}<span class="ampm">{{AMPM}}</span></div>
      <div class="what">
        <div class="cls">{{CLASS_NAME}} <span class="dur">· {{DURATION}}</span></div>
        <div class="teacher">with {{TEACHER}}</div>
      </div>
    </div>
<!--/ROW-->
  </div>

  <div class="footer">
    <div class="place">Fremont · Seattle</div>
    <div class="cta">sealevelhotyoga.com</div>
  </div>
</body>
</html>
