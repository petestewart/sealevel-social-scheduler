<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; }
  body {
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    background:#3b342b;
    background:radial-gradient(120% 90% at 50% 0%, #4a4238 0%, #3b342b 62%, #332d25 100%);
    color:#fbf7f0;
    display:flex; flex-direction:column;
    align-items:center;
    padding:64px 110px 0;
  }
  .logo{ width:430px; height:auto; flex:0 0 auto; }

  /* ---- arched inset photo ---- */
  .arch-wrap{
    margin-top:52px;
    flex:0 0 auto;
    position:relative;
  }
  .arch{
    width:360px; height:430px;
    object-fit:cover;
    border-radius:180px 180px 0 0;
    display:block;
    border:9px solid #f1ece2;
    box-shadow:0 24px 60px rgba(0,0,0,0.35);
    filter:sepia(0.12) brightness(1.02);
  }
  /* faint echo arch behind, offset */
  .arch-wrap::before{
    content:'';
    position:absolute; top:-20px; left:-24px;
    width:378px; height:450px;
    border:2px solid rgba(231,156,128,0.45);
    border-bottom:none;
    border-radius:190px 190px 0 0;
  }

  /* ---- heading ---- */
  .eyebrow{
    margin-top:46px;
    font-weight:700; text-transform:uppercase;
    letter-spacing:0.34em; font-size:21px; color:#e79c80;
  }
  h1{
    margin-top:16px;
    font-family:Georgia, 'Times New Roman', serif;
    font-style:italic; font-weight:400;
    font-size:66px; color:#fbf7f0;
    letter-spacing:0.01em;
  }

  /* ---- class list ---- */
  .rows{
    margin-top:18px;
    flex:1;
    width:100%;
    display:flex; flex-direction:column;
    justify-content:space-evenly;
  }
  .row{
    display:flex; align-items:baseline; justify-content:center;
    gap:34px;
    padding:16px 0;
    border-top:1px solid rgba(251,247,240,0.16);
  }
  .row:first-child{ border-top:none; }
  .time{
    font-family:Georgia, serif;
    font-size:42px; color:#e79c80;
    width:215px; flex:0 0 auto; text-align:right;
    white-space:nowrap;
  }
  .time .ampm{ font-size:24px; font-style:italic; margin-left:5px; opacity:0.85; }
  .what{ width:440px; flex:0 0 auto; text-align:left; }
  .cls{
    font-weight:300; font-size:33px; color:#fbf7f0;
  }
  .cls .dur{ color:rgba(251,247,240,0.55); }
  .teacher{
    margin-top:5px;
    font-family:Georgia, serif; font-style:italic;
    font-size:23px; color:rgba(251,247,240,0.6);
  }

  /* ---- footer ---- */
  .footer{
    flex:0 0 auto;
    width:100%;
    border-top:1px solid rgba(251,247,240,0.16);
    padding:30px 0 42px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .place{
    font-weight:700; text-transform:uppercase;
    letter-spacing:0.26em; font-size:19px; color:rgba(251,247,240,0.66);
  }
  .cta{
    font-family:Georgia, serif; font-style:italic;
    font-size:27px; color:#fbf7f0;
    text-decoration:underline wavy #da8263;
    text-underline-offset:10px;
    text-decoration-thickness:2px;
  }
</style>
</head>
<body>
  <img class="logo" src="{{ASSETS}}/logo-v3.png" alt="Sealevel Hot Yoga">

  <div class="arch-wrap">
    <img class="arch" src="{{ASSETS}}/photos/SL-INST-7-of-16.jpg" alt="Seated meditation">
  </div>

  <div class="eyebrow">Tomorrow on the mat</div>
  <h1>{{DAY_NAME}}, {{MONTH_DAY}}</h1>

  <div class="rows">
    <!--ROW-->
<div class="row">
      <div class="time">{{TIME}}<span class="ampm">{{AMPM}}</span></div>
      <div class="what">
        <div class="cls">{{CLASS_NAME}} <span class="dur">· {{DURATION}}</span></div>
        <div class="teacher">with {{TEACHER}}</div>
      </div>
    </div>
<!--/ROW-->
  </div>

  <div class="footer">
    <div class="place">Fremont · Seattle</div>
    <div class="cta">sealevelhotyoga.com</div>
  </div>
</body>
</html>
