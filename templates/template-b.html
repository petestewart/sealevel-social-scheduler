<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #fbf7f0;
    color: #4a4238;
    display: flex; flex-direction: column;
  }
  .photo {
    position: relative; flex: 1 1 740px; min-height: 550px; overflow: hidden;
    background: url('{{ASSETS}}/photos/about-2-min.png') center 68% / cover no-repeat;
  }
  .photo .tint {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(242,218,196,0.30) 0%, rgba(242,218,196,0.05) 55%, rgba(251,247,240,1) 99%);
  }
  .photo .marque {
    position: absolute; top: 250px; left: 84px; width: 560px;
  }
  .body { flex: 0 0 auto; display: flex; flex-direction: column; padding: 12px 84px 274px; }
  .eyebrow {
    font-size: 34px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: #c76a49;
  }
  h1 {
    margin-top: 10px;
    font-weight: 300; font-size: 84px; letter-spacing: -0.005em; line-height: 1.03;
    color: #1c1c1c;
  }
  h1 em { font-family: Georgia, serif; font-style: italic; font-weight: normal; color: #4f9080; }
  .classes { margin-top: 30px; display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: baseline; gap: 36px;
    padding: 24px 4px;
    border-top: 1.5px solid #e7dccb;
  }
  .row:first-child { border-top: none; }
  .time { font-family: Georgia, serif; font-size: 64px; color: #c76a49; min-width: 300px; }
  .ampm { font-size: 34px; font-style: italic; }
  .cls { font-size: 52px; font-weight: 400; color: #1c1c1c; }
  .teacher { font-size: 38px; color: #3f382e; margin-top: 8px; }
  .footer {
    margin-top: auto; padding-top: 26px; border-top: 1.5px solid #e7dccb;
    display: flex; flex-direction: column; gap: 10px;
    font-size: 32px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #4a4238;
  }
  .footer .wavy span {
    color: #4f9080;
    
  }
</style>
</head>
<body>
  <div class="photo">
    <div class="tint"></div>
    <img class="marque" src="{{ASSETS}}/logo-rect-stacked.png">
  </div>
  <div class="body">
    <div class="eyebrow">Tomorrow · {{DAY_NAME}}, {{MONTH_DAY}}</div>
    <h1>Breathe in,<br><em>sweat it out.</em></h1>
    <div class="classes">
      <!--ROW-->
<div class="row">
        <div class="time">{{TIME}}<span class="ampm"> {{AMPM}}</span></div>
        <div><div class="cls">{{CLASS_NAME}} · {{DURATION}}</div><div class="teacher">with {{TEACHER}}</div></div>
      </div>
<!--/ROW-->
    </div>
    <div class="footer">
      <div>Fremont · Seattle</div>
      <div class="wavy">Book your class at <span>sealevelhotyoga.com</span></div>
    </div>
  </div>
</body>
</html>
