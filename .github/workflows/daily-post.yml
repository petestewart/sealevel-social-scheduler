name: Daily schedule post

on:
  schedule:
    # Target: ~7:00pm America/Los_Angeles (02:00 UTC in PDT, 03:00 UTC in PST).
    # GitHub cron drifts badly (hours under load), so fire several attempts at
    # offset minutes; the guard accepts a wide evening window and a marker file
    # ensures only the FIRST successful attempt posts each day.
    - cron: "3 2 * * *"
    - cron: "33 2 * * *"
    - cron: "3 3 * * *"
    - cron: "33 3 * * *"
    - cron: "3 4 * * *"
  # Primary trigger: an external scheduler pushes trigger/fire at ~7pm LA.
  # Push events start workflows within seconds (no cron queue), unlike
  # schedule. The guard still enforces the once-per-day marker, so a
  # delayed cron landing after a push can't double-post (and vice versa).
  push:
    paths:
      - "trigger/fire"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to post (YYYY-MM-DD, default: tomorrow in LA)"
        required: false
      dry_run:
        description: "Render + commit only, skip posting"
        type: boolean
        default: false
      fixture:
        description: "Use fixture data instead of the live Mindbody widget"
        type: boolean
        default: false
      media_type:
        description: "Instagram media type"
        type: choice
        options: [STORIES, FEED]
        default: STORIES

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — evening window + not already posted (scheduled runs)
        id: guard
        run: |
          target="${{ inputs.date }}"
          [ -z "$target" ] && target=$(TZ=America/Los_Angeles date -d tomorrow +%F)
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hour=$(TZ=America/Los_Angeles date +%H)
            if [ "$hour" -lt 19 ] || [ "$hour" -gt 22 ]; then
              echo "Outside the 7-11pm LA window (hour=$hour). Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          # Trigger pushes are deliberate (no window), but never post twice.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f "posts/$target.posted" ]; then
            echo "Already posted for $target (marker exists). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci || npm install

      - name: Install Chrome
        if: steps.guard.outputs.skip != 'true'
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Render tomorrow's post
        if: steps.guard.outputs.skip != 'true'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node src/run.mjs \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.fixture == true && '--fixture' || '' }}

      - name: Commit rendered image
        if: steps.guard.outputs.skip != 'true'
        id: commit
        run: |
          git config user.name "sealevel-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "Nothing new to commit (already rendered today?)."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Schedule post $(date +%F)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Instagram + Facebook
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        env:
          IG_LOGIN_TOKEN: ${{ secrets.IG_LOGIN_TOKEN }}
          IG_LOGIN_USER_ID: ${{ secrets.IG_LOGIN_USER_ID }}
          IG_MEDIA_TYPE: ${{ inputs.media_type || 'STORIES' }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: |
          node src/post.mjs \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Record posted marker
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          touch "posts/${{ steps.guard.outputs.target }}.posted"
          git add posts/
          git pull --rebase origin main || true
          git commit -m "Posted marker ${{ steps.guard.outputs.target }}" && git push || echo "marker already recorded"

      # Email fallback/preview: needs GMAIL_ADDRESS + GMAIL_APP_PASSWORD secrets.
      # Sends the finished image + caption to your inbox at 7pm — post from the
      # Instagram app in ~30s, with IG's native "Share to Facebook" covering FB.
      - name: Email the finished post
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true && env.GMAIL_APP_PASSWORD != ''
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Sealevel Schedule Bot <${{ secrets.GMAIL_ADDRESS }}>
          to: ${{ secrets.GMAIL_ADDRESS }}
          subject: "Tomorrow's schedule post is ready 🧘"
          body: file://posts/caption-latest.txt
          attachments: posts/image-latest.jpg

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: posts/tmp/
          if-no-files-found: ignore

      - name: Print debug snippet on failure
        if: failure()
        run: |
          echo "=== widget-debug.html (first 4000 bytes) ==="
          head -c 4000 posts/tmp/widget-debug.html 2>/dev/null || echo "(no debug file)"
